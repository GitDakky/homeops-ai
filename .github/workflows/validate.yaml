name: Validate add-on

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run baseline local validation
        run: bash scripts/validate_local.sh
        env:
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

configuration:
  timezone:
    name: Zeitzone
    description: Zeitzone für das Add-on (z.B. Europe/Sofia, America/New_York)
  
  agent_mode:
    name: Agent Routing Mode
    description: Select how HomeOps routes requests. Router is recommended: fast voice/status tasks use the fast lane, diagnostics use the complex lane, and long investigations use the deep lane.
    options:
      router: "Router (recommended)"
      fast: "Fast only"
      complex: "Complex agent"
      deep: "Deep operations"
  fast_llm_provider:
    name: Fast Lane Provider
    description: Provider for low-latency voice, status, classification, and entity-routing tasks. OpenRouter, Groq, or a local OpenAI-compatible server are good candidates.
  fast_llm_model:
    name: Fast Lane Model
    description: Model ID for fast HA tasks. Suggested starting points include google/gemini-3.1-flash-lite, x-ai/grok-4.1-fast, qwen/qwen3.6-flash, or openai/gpt-oss-120b.
  complex_llm_provider:
    name: Complex Lane Provider
    description: Provider for normal Hermes HomeOps diagnostics and multi-step reasoning.
  complex_llm_model:
    name: Complex Lane Model
    description: Model ID for diagnostics, log review, and HomeOps reasoning.
  deep_llm_provider:
    name: Deep Ops Provider
    description: Provider for long-running audits, repairs, and planning jobs.
  deep_llm_model:
    name: Deep Ops Model
    description: Model ID for the strongest/slowest lane. Use this for background tasks where quality matters more than latency.
  local_llm_provider:
    name: Local / Ultra-Fast Provider
    description: Optional provider for local, Groq, Ollama, vLLM, or other OpenAI-compatible inference used by the fast lane or experiments.
  local_llm_model:
    name: Local / Ultra-Fast Model
    description: Model ID for the local or ultra-fast lane. openai/gpt-oss-120b is a useful candidate if your provider serves it quickly and tool calling tests pass.
  local_llm_base_url:
    name: Local / Ultra-Fast Base URL
    description: Optional OpenAI-compatible base URL for local/Groq/vLLM/Ollama-style inference.
  max_fast_entities:
    name: Fast Lane Entity Limit
    description: Maximum number of candidate Home Assistant entities to pass to the fast lane. Keep this low to avoid slow prompts on large homes.
  routing_guidance:
    name: Show Routing Guidance
    description: Show guidance notes in the UI/docs explaining the fast, complex, and deep lanes.
  enable_terminal:
    name: Web-Terminal aktivieren
    description: Web-Terminal-Schaltfläche in Home Assistant (Ingress) über ttyd aktivieren
  
  terminal_port:
    name: Terminal-Port
    description: Portnummer für das Web-Terminal (Standard - 7682). Ändern Sie diese, wenn dieser Port mit einem anderen Dienst in Konflikt steht.
  
  gateway_public_url:
    name: Öffentliche Gateway-URL
    description: Optionaler Override für die Start-URL der Gateway-Weboberfläche. In den meisten lokalen Installationen erkennt das Add-on diese automatisch vom aktuellen Home-Assistant-Host. Nur setzen, wenn Sie einen anderen Reverse-Proxy-, HTTPS- oder Tailscale-Hostnamen benötigen.
  
  homeassistant_token:
    name: Home Assistant Token
    description: Optional - Langlebiger Home Assistant Token für lokale API-Skripte/Tools

  enable_builtin_ha_tools:
    name: Eingebaute Home-Assistant-Tools aktivieren
    description: "Wenn EIN (empfohlen), registriert das Add-on einen lokalen Home-Assistant-MCP-Server, damit Hermes live Entities, Geräte, Bereiche, Automationen, Services und Verlauf ohne zusätzliche Token-Einrichtung lesen kann."

  enable_ha_service_calls:
    name: Home-Assistant-Serviceaufrufe erlauben
    description: "Wenn EIN, stellt die eingebaute Home-Assistant-Tool-Ebene zusätzlich das mutierende Tool `ha_service_call` bereit. Lassen Sie dies AUS, außer wenn Hermes nach ausdrücklicher Benutzerfreigabe Home-Assistant-Services aufrufen darf."

  http_proxy:
    name: Ausgehender HTTP-Proxy
    description: Optional - Proxy-URL für ausgehende HTTP/HTTPS-Anfragen (Beispiel - http://192.168.2.1:3128)
  
  router_ssh_host:
    name: Router SSH-Host
    description: Optional - SSH-Hostname oder IP-Adresse des Routers/der Firewall
  
  router_ssh_user:
    name: Router SSH-Benutzer
    description: Optional - SSH-Benutzername für Router/Firewall
  
  router_ssh_key_path:
    name: Router SSH-Schlüsselpfad
    description: Pfad zum privaten SSH-Schlüssel für Router-Zugriff (Standard - /data/keys/router_ssh)
  
  clean_session_locks_on_start:
    name: Sitzungssperren beim Start bereinigen
    description: Veraltete Sitzungssperrdateien nach Abstürzen/Neustarts beim Start des Add-ons bereinigen
  
  clean_session_locks_on_exit:
    name: Sitzungssperren beim Beenden bereinigen
    description: Sitzungssperrdateien beim ordnungsgemäßen Stoppen des Add-ons bereinigen
  
  gateway_mode:
    name: Gateway-Modus
    description: Gateway-Betriebsmodus - local (Gateway lokal ausführen, empfohlen) oder remote (mit einem entfernten Gateway verbinden)
    options:
      local: "Lokal (empfohlen)"
      remote: "Remote"

  gateway_remote_url:
    name: Remote Gateway-URL
    description: Remote-Gateway-WebSocket-URL, verwendet wenn Gateway-Modus auf Remote steht (Beispiel - ws://192.168.1.20:18790 oder wss://gateway.example.com:443)

  gateway_additional_allowed_origins:
    name: Zusätzliche erlaubte Origins
    description: Kommagetrennte zusätzliche Control-UI-Origins, die bei lan_https in gateway.controlUi.allowedOrigins zusammengeführt werden (Beispiel - https://ha.example.com:8443,capacitor://localhost)

  controlui_disable_device_auth:
    name: Control-UI-Geräte-Pairing deaktivieren (lan_https)
    description: "Wenn EIN (empfohlen), setzt dies gateway.controlUi.dangerouslyDisableDeviceAuth=true, überspringt die Gerätefreigabe und vermeidet Fehler 1008 im LAN-HTTPS-Modus. Für Heim-/vertrauenswürdiges LAN eingeschaltet lassen. Nur AUS schalten, wenn du striktes Geräte-Pairing für jeden neuen Browser/jedes neue Gerät willst."

  disable_exec_approvals:
    name: Exec-Approval-Abfragen deaktivieren
    description: "Wenn EIN, erzwingt dies für Hermes-Host-Exec-Approvals security=full, ask=off, askFallback=full und richtet tools.exec.host=gateway, tools.exec.security=full, tools.exec.ask=off und strictInlineEval=false aus. Dieser Fork setzt das standardmäßig auf EIN, damit Automationen nicht auf menschliche Freigaben warten. Nur AUS schalten, wenn du Approval-Abfragen wiederhaben willst."

  enable_matrix:
    name: Matrix-Kanal aktivieren
    description: "Aktiviert Matrix-Unterstützung aus den Home-Assistant-Einstellungen. Wenn EIN und Homeserver plus nutzbare Anmeldung konfiguriert sind, konfiguriert das Add-on channels.matrix in Hermes und versucht, das Matrix-Plugin bereitzustellen."

  matrix_homeserver:
    name: Matrix-Homeserver
    description: "Matrix-Homeserver-URL, zum Beispiel https://matrix.example.org oder http://matrix-synapse:8008 für eine private Synapse-Instanz."

  matrix_allow_private_network:
    name: Privaten Matrix-Homeserver erlauben
    description: "Wenn EIN, erlaubt dies Matrix-Homeserver auf localhost, LAN, Tailscale oder internen Hostnamen. Erforderlich für private Synapse-/Dendrite-Installationen."

  matrix_user_id:
    name: Matrix-Benutzer-ID
    description: "Vollständige Matrix-Benutzer-ID für das Bot-Konto, zum Beispiel @hermes:example.org."

  matrix_access_token:
    name: Matrix-Access-Token
    description: "Bevorzugte Matrix-Authentifizierung. Wenn gesetzt, schreibt das Add-on channels.matrix.accessToken und ignoriert matrix_password."

  matrix_password:
    name: Matrix-Passwort
    description: "Fallback-Passwort für Matrix-Login, wenn kein Access-Token gesetzt ist. Nutze entweder Token oder Passwort."

  matrix_encryption:
    name: Matrix-Verschlüsselung
    description: "Aktiviert Matrix-Ende-zu-Ende-Verschlüsselung für das konfigurierte Konto."

  matrix_dm_policy:
    name: Matrix-DM-Richtlinie
    description: "DM-Zugriffsrichtlinie für Matrix. pairing ist der sicherste Standard, open erlaubt Direktnachrichten ohne Pairing, allowlist beschränkt DMs auf freigegebene Nutzer."

  matrix_dm_allow_from:
    name: Matrix-DM-Allowlist
    description: "Kommagetrennte Matrix-Benutzer-IDs, die dem Bot schreiben dürfen, wenn die DM-Richtlinie allowlist ist."

  matrix_group_policy:
    name: Matrix-Raumrichtlinie
    description: "Raumzugriffsrichtlinie für Matrix. open ist am einfachsten für ad-hoc Einladungen, allowlist beschränkt Antworten auf Räume aus der Matrix-Raum-Allowlist, disabled blockiert Raumverkehr."

  matrix_group_allow_from:
    name: Matrix-Raum-Benutzer-Allowlist
    description: "Optionale kommagetrennte Matrix-Benutzer-IDs, die Antworten in Räumen auslösen dürfen."

  matrix_room_allowlist:
    name: Matrix-Raum-Allowlist
    description: "Kommagetrennte Raum-IDs oder Aliase für Raum-Allowlist-Modus und Auto-Join-Allowlist-Modus."

  matrix_auto_join:
    name: Matrix-Auto-Join
    description: "Einladungs-Auto-Join-Richtlinie. always erlaubt ad-hoc Einladungen ohne Vorab-Whitelist, allowlist tritt nur Räumen aus der Matrix-Raum-Allowlist bei, off deaktiviert Auto-Join."

  gateway_bind_mode:
    name: Gateway-Bindungsmodus
    description: Netzwerk-Bindungsmodus - loopback (nur 127.0.0.1, am sichersten), lan (alle Schnittstellen) oder tailnet (nur Tailscale-Schnittstelle). Wird durch Zugriffsmodus-Voreinstellungen überschrieben.
    options:
      loopback: "Loopback (nur 127.0.0.1, am sichersten)"
      lan: "LAN (alle Schnittstellen)"
      tailnet: "Tailnet (nur Tailscale)"

  gateway_port:
    name: Gateway-Port
    description: Portnummer, auf der das Hermes-Gateway lauscht (Standard - 18790)

  access_mode:
    name: Zugriffsmodus
    description: "Vereinfacht die sichere Zugriffskonfiguration. Überschreibt gateway_bind_mode und gateway_auth_mode wenn nicht auf Benutzerdefiniert gesetzt."
    options:
      custom: "Benutzerdefiniert (individuelle Einstellungen)"
      local_only: "Nur lokal (Loopback + Token, nur Ingress)"
      lan_https: "LAN HTTPS (eingebauter HTTPS-Proxy — empfohlen für Smartphones)"
      lan_reverse_proxy: "LAN Reverse-Proxy (externer Proxy mit Trusted-Proxy-Auth)"
      tailnet_https: "Tailscale HTTPS (Tailscale-Bindung + Token)"

  gateway_auth_mode:
    name: Gateway-Authentifizierungsmodus
    description: Gateway-Auth-Modus - token (Standard) oder trusted-proxy (für HTTPS-Reverse-Proxys). Wird überschrieben wenn access_mode nicht Benutzerdefiniert ist.
    options:
      token: "Token (Standard)"
      trusted-proxy: "Vertrauenswürdiger Proxy (für Reverse-Proxys)"

  gateway_trusted_proxies:
    name: Vertrauenswürdige Gateway-Proxys
    description: Komma-getrennte Liste vertrauenswürdiger Proxy-IPs/CIDRs für den Trusted-Proxy-Modus (Beispiel - 127.0.0.1,192.168.88.0/24).

  enable_openai_api:
    name: OpenAI API aktivieren
    description: OpenAI-kompatiblen Chat Completions Endpunkt aktivieren. Ermöglicht die Verwendung von Hermes als Gesprächsagent in der HA Assist Pipeline über Extended OpenAI Conversation (HACS) oder jeden OpenAI-kompatiblen Client.
  force_ipv4_dns:
    name: IPv4-DNS-Reihenfolge erzwingen
    description: Erzwingt IPv4-vorrangige DNS-Auflösung. Die meisten HAOS-VMs haben keinen IPv6-Ausgang — verursacht web_fetch- und Telegram-Timeouts. Empfohlen EIN (Standard).
  nginx_log_level:
    name: Nginx Log-Level
    description: "Ausführlichkeit des Nginx-Zugriffslogs. 'minimal' (Standard) unterdrückt wiederholte HA-Healthcheck- und Polling-Anfragen. 'full' protokolliert alles."
    options:
      minimal: "Minimal (HA-Polling-Rauschen unterdrücken)"
      full: "Vollständig (alle Anfragen protokollieren)"
  gateway_env_vars:
    name: Gateway-Umgebungsvariablen
    description: Umgebungsvariablen, die beim Start an den Hermes-Gateway-Prozess übergeben werden (Liste mit name/value-Einträgen in der Home Assistant UI; max. 50 Variablen, Schlüssel bis 255 Zeichen, Werte bis 10.000 Zeichen).
  auto_configure_mcp:
    name: MCP für Home Assistant automatisch konfigurieren
    description: "Veralteter externer MCP-Pfad. Wenn AN und ein Home-Assistant-Token gesetzt ist, registriert er den externen MCP-Endpunkt von Home Assistant beim Start. Dies wird ignoriert, wenn die eingebaute Home-Assistant-Tool-Ebene aktiviert ist."
  enable_context7:
    name: Context7-Recherche aktivieren
    description: "Wenn AN, weist der vorinstallierte Workspace den Assistenten an, Context7 für aktuelle Dokumentation zu verwenden, sobald ein API-Schlüssel vorhanden ist."
  context7_api_key:
    name: Context7-API-Schlüssel
    description: Optional - API-Schlüssel für Context7-Dokumentationsabfragen
  domotz_api_key:
    name: Domotz-API-Schlüssel
    description: Optional - API-Schlüssel für Domotz-Netzinventar und Monitoringdaten
  domotz_site_id:
    name: Domotz-Site-ID
    description: Optional - Site-ID zur Verwendung mit dem Domotz-API-Schlüssel
  github_issues_token:
    name: GitHub-Issues-Token
    description: Optional - Fine-grained GitHub-Token mit Issues-Schreibzugriff für direktes Anlegen von Issues in GitDakky/homeops-ai
  mqtt_broker_url:
    name: MQTT-Broker-URL
    description: Optional - Externe MQTT-Broker-URL (Beispiel - mqtts://cluster.s2.eu.hivemq.cloud:8883)
  mqtt_username:
    name: MQTT-Benutzername
    description: Optional - Benutzername für den konfigurierten MQTT-Broker
  mqtt_password:
    name: MQTT-Passwort
    description: Optional - Passwort für den konfigurierten MQTT-Broker
  enable_bacnet_scout:
    name: BACnet Scout aktivieren
    description: "Wenn AN, werden BACnet/IP-Hinweise, Dashboard-Status und Graph-Grundlagen aktiviert. Es findet kein stilles Netzwerkscanning statt."
